# Benchmarks: `brokkr bench wall --workload <name>` for verdict walls,
# `brokkr bench --hotpath <kernel|alloc> --workload <name>` to profile.
# Included from brokkr.toml; `brokkr man bench-config` documents the tables.
#
# Every bench builds the harness bin (`dellingr-bench`,
# src/bin/dellingr-bench.rs, gated behind the `bench-harness` feature) and
# runs brokkr.d/bench.lua over one pinned workload file:
#
# - `wall` times the seconds-scale file: the uninstrumented walls, the ones
#   worth comparing. It declares no `hotpath_features`, so brokkr refuses
#   `--hotpath` on it.
# - `kernel` times the ms-scale file; under `--hotpath` it adds the `hotpath`
#   feature (function-level timing).
# - `alloc` is `kernel` with `hotpath-alloc` under `--hotpath` (per-function
#   allocation tracking). Without `--hotpath` it is a plain `kernel` run.
#
# Workloads are content-addressed: the file is part of the measurement's
# identity, so editing a workload file REQUIRES updating its `xxhash` here -
# that re-registration is the deliberate signal that older stored runs no
# longer compare against new ones (`brokkr bench` refuses on drift). Not
# hostname-keyed: these files are in git, identical on every host.
#
# Each workload name is registered at both scales, scale outer:
#
# - `data.workloads.bench`: the bench/ seconds-scale port, what `wall` binds.
#   Seconds-scale so wall deltas resolve above launch noise.
# - `data.workloads.hotpath`: the examples/ ms-scale kernel, the only scale
#   the profilable benches can bind. The hotpath crate queues one event per
#   instrumented call in an unbounded per-thread queue that its 50ms sweep
#   drains at ~1.3M events/s, far below the VM's production rate; a
#   seconds-scale file backlogs 30+ GB of RAM before the run ends (observed
#   2026-07-26 on plantasjen). Binding only this scale, and `wall` carrying no
#   `hotpath_features`, makes that unrepresentable.
#
# Paired files carry the same kernel, so hotpath percentages read across to
# the bench walls. `large_source` is a parse/codegen probe, not an execution
# workload; interpret its timing as a parse/codegen diagnostic, so both scales
# use the same generated source.
#
# tests/integration/corpus/bench_scripts.rs checks matching bytecode and
# literal pools for each pair's kernel and shared helpers as well as cost
# fingerprints, the pins, and that both scales register the same names.
# Top-level setup and the verdict wrapper's repeat count (`K`, or a literal
# bound in a wrapper without one) are not compared: the count is calibrated
# per kernel for wall time, and setup is re-checked by eye when either file
# changes.

[bench.wall]
script_file = "bench.lua"
target = "dellingr-bench"
profile = "release"
features = ["bench-harness"]
params.workload = { from = "data.workloads.bench", required = true, help = "seconds-scale workload from bench/" }

[bench.kernel]
script_file = "bench.lua"
target = "dellingr-bench"
profile = "release"
features = ["bench-harness"]
hotpath_features = ["hotpath"]
params.workload = { from = "data.workloads.hotpath", required = true, help = "ms-scale workload from examples/" }

[bench.alloc]
script_file = "bench.lua"
target = "dellingr-bench"
profile = "release"
features = ["bench-harness"]
hotpath_features = ["hotpath-alloc"]
params.workload = { from = "data.workloads.hotpath", required = true, help = "ms-scale workload from examples/" }

# Rust-driven scenarios (brokkr.d/host.lua; registrations below). `host` and
# `snapshot` time the seconds-scale files and carry no `hotpath_features`;
# the `_kernel` tables bind only the ms-scale files. The snapshot scenarios
# need the `snapshot` feature, which slows ordinary execution, so they have
# tables of their own and the other tables never build with it.
[bench.host]
script_file = "host.lua"
target = "dellingr-bench"
profile = "release"
features = ["bench-harness"]
params.scenario = { from = "data.scenarios.bench", required = true, help = "seconds-scale scenario from bench/host/" }

[bench.host_kernel]
script_file = "host.lua"
target = "dellingr-bench"
profile = "release"
features = ["bench-harness"]
hotpath_features = ["hotpath"]
params.scenario = { from = "data.scenarios.hotpath", required = true, help = "ms-scale scenario from bench/host/small/" }

[bench.snapshot]
script_file = "host.lua"
target = "dellingr-bench"
profile = "release"
features = ["bench-harness", "snapshot"]
params.scenario = { from = "data.snapshot_scenarios.bench", required = true, help = "seconds-scale snapshot scenario from bench/host/" }

[bench.snapshot_kernel]
script_file = "host.lua"
target = "dellingr-bench"
profile = "release"
features = ["bench-harness", "snapshot"]
hotpath_features = ["hotpath"]
params.scenario = { from = "data.snapshot_scenarios.hotpath", required = true, help = "ms-scale snapshot scenario from bench/host/small/" }


# Rust-driven scenarios (brokkr.d/host.lua): one pinned file per kind and
# scale under bench/host/ (seconds scale) and bench/host/small/ (ms scale,
# the only one the profilable tables bind). The file's
# `-- Harness scenario: <kind>` line picks the harness driver, its `count`
# global the scale; both are in the pin. A kind's name is part of the
# measurement's identity: a change to what a driver does is a new kind (and
# file) name, never an edit under the old one, since an older binary that
# knows the old name would run the old work. A binary older than the
# scenario harness fails these files instead of mis-measuring them, so
# `--commit` baselines start at the commit that added it.


project = "dellingr"
include = ["brokkr.d/bench.toml"]

# These crates are absent, so Clippy paths into them cannot resolve. Refuse
# their introduction at the dependency boundary instead of keeping no-op bans.
[[dependency_rule]]
name = "no-host-entropy"
from = "dellingr"
forbid = ["rand", "rand_core", "getrandom"]

# Direct consumer dependency allowlist.
[[dependency_rule]]
name = "consumer-dependencies"
from = "dellingr"
kinds = ["normal", "build"]
allow = ["indexmap", "foldhash", "hashbrown", "slotmap", "hotpath", "libc"]

# libc reaches a consumer's graph only through `bench-harness`, the harness
# bin's feature; the library itself never links it.
[[dependency_rule]]
name = "libc-must-be-optional"
from = "dellingr"
forbid = ["libc"]
kinds = ["normal"]
optional = false

# The profiler reaches a consumer's graph only through the `hotpath` feature.
# A non-optional hotpath dependency would link it into every default build.
[[dependency_rule]]
name = "hotpath-must-be-optional"
from = "dellingr"
forbid = ["hotpath"]
kinds = ["normal"]
optional = false

[rustdoc]

[[fixture_lint]]
name = "determinism-policy"
# Ordinary brokkr check must also prove that every determinism ban fires.
when = "always"
path = "fixtures/lint-policy"
manifest = "fixtures/lint-policy/expect.toml"
seed_lock = true
lint_args = ["-W", "clippy::disallowed_methods", "-W", "clippy::disallowed_types"]

[[fixture_lint.variant]]
name = "walk-up"
unset = ["CLIPPY_CONF_DIR"]

[[fixture_lint.variant]]
name = "explicit"
env = { CLIPPY_CONF_DIR = "{root}" }

# `.scratch/` is gitignored and belongs to the developer; dellingr does not
# police its contents, so every check starts by wiping it (killed manual runs
# of scripts/diff_test.sh, the Python fixture tests' trees, old bench
# results). The stage is the default pre-clippy one, and this entry is
# declared first: entries at a stage run in declaration order, so it finishes
# before the Python fixture tests below (which write there) start. Tests do
# not write files, so the test phase never touches it. A later stage
# (post-test) would also be safe from deleting live files, but it is skipped
# when tests fail. A background stage would race the fixture tests.
# Everything that writes to `.scratch/` recreates it. Python does the removal,
# so the gate needs no tool beyond the ones check-tools below verifies.
[[script_check]]
name = "wipe-scratch"
command = '''python3 -B -c "import pathlib, shutil; p = pathlib.Path('.scratch'); p.unlink() if p.is_symlink() or p.is_file() else shutil.rmtree(p) if p.exists() else None; print('ok')"'''
expect = "ok"
match = "last-line"
stream = "stdout"
stage = "pre-clippy"

# Every external tool the gate needs, with the reference Luas' release and
# compatibility flags pinned (the script's docstring lists what each tool is
# for). It runs before anything compiles, so a host missing one learns which
# here instead of from a failure deep in a test. Script checks at the same
# stage all run, so this names the problem first but does not stop the rest.
[[script_check]]
name = "check-tools"
command = "python3 -B scripts/check_tools.py"
expect = "ok"
match = "last-line"
stream = "stdout"
stage = "pre-clippy"

[[script_check]]
name = "lint-policy-inventory"
command = "python3 -B fixtures/lint-policy/check_policy.py"
expect = "ok"
match = "last-line"
stream = "stdout"

# The reviewed digests of the generated crmath tables, checked without the
# upstream checkout. The checkout-dependent `--check` is a manual command run
# when regenerating tables (AGENTS.md).
[[script_check]]
name = "crmath-table-pins"
command = "python3 -B scripts/crmath_tables.py --check-pins"
expect = "generated table digests match reference/core-math-pin.toml"
match = "last-line"
stream = "stdout"
stage = "pre-clippy"

# `brokkr check` runs each [[check]] entry as its own (clippy + test) pass with
# the named feature shape. We sweep both feature configurations because
# `snapshot` guards real code behind `cfg(feature = "snapshot")` *and*
# `cfg(not(feature = "snapshot"))` (stdlib Rust-fn registration, the `_G`
# metatable install, RNG fn naming). A single `--all-features` pass only ever
# compiles the `feature = ...` side, so the default consumer build - the one
# that actually ships - would go unchecked without its own sweep.
#
#  - "default"    = no features. The downstream-consumer view; catches lints
#                   and compile errors in the always-compiled and
#                   `cfg(not(feature = "snapshot"))` code paths.
#  - "snapshot" = the save/load subsystem enabled, covering save_state.rs,
#                   the env/fn registry, and the integration + codec tests.
#
# Each shape's example corpus gate, one test per example under
# `corpus::run_examples::standalone::`, runs in a sibling sweep of the same
# build, "default-corpus" and "snapshot-corpus", which runs only those tests
# in the parallel lane; the shape's main sweep skips them, and the rest of the
# crate (million-slot at-cap tests and their memory peaks included) stays
# serial. The corpus tests spend their time in the CLI and reference Lua
# processes they start, so they overlap well. The test
# `corpus::run_examples::standalone_tests_run_in_one_parallel_lane_per_shape`
# holds these entries to that partition.
#
# Every dev entry of these two shapes, doc twins included, pins
# `feature_unification = "workspace"`. brokkr promotes a parallel sweep that
# selects the whole workspace to workspace unification on its own, and its
# clippy and rustdoc dedupe keys include the unification mode, so without the
# pin each sibling is linted and documented as a shape of its own. (For this
# one-package workspace the mode builds the same artifacts as cargo's default;
# pinning `selected` on the siblings instead rebuilt the integration binary
# under different content on every check.)

# `bench-harness` only adds the `dellingr-bench` bin (its unit tests and
# lints); the library compiles as the consumer's default build.
[[check]]
name = "default"
features = ["bench-harness"]
skip = ["corpus::run_examples::standalone::"]
feature_unification = "workspace"

[[check]]
name = "default-corpus"
features = ["bench-harness"]
only = ["corpus::run_examples::standalone::"]
parallel = {}
feature_unification = "workspace"

[[check]]
name = "snapshot"
features = ["snapshot"]
# Selection rule: run every test admitted by this feature shape. Registration
# changes can affect any test using the stdlib, _G or RNG names, as well as
# saving, corpus round trips and cost goldens. New feature-sensitive tests are
# picked up automatically, without an allowlist that can silently lose them.
# Keep the shape running every test until feature independence has a
# mechanical contract; module names and the absence of cfg in a test do not
# prove independence. The one filter is the corpus partition above:
# "snapshot-corpus" runs exactly what it skips.
skip = ["corpus::run_examples::standalone::"]
feature_unification = "workspace"

[[check]]
name = "snapshot-corpus"
features = ["snapshot"]
only = ["corpus::run_examples::standalone::"]
parallel = {}
feature_unification = "workspace"

# Explicit dev lanes keep doctests out of instrumentation and release probes.
[[check]]
name = "docs-default"
doc_only = true
feature_unification = "workspace"

[[check]]
name = "docs-snapshot"
features = ["snapshot"]
doc_only = true
feature_unification = "workspace"

# Compile and lint instrumentation and refusal hooks in one extra dev shape.
# Run only refusal tests: the ordinary sweeps already cover the corpus, and
# instrumentation is not a production native-stack configuration. The shape
# also enables `crmath-sweeps` so the gated math sweeps compile and lint here;
# the `only` filter keeps them from running.
[[check]]
name = "instrumentation-faults"
features = ["bench-harness", "hotpath", "hotpath-alloc", "fault-injection", "snapshot", "crmath-sweeps"]
tests = ["integration"]
lib_tests = true
only = [
    "failures::error_boundary::error_boundary_fault_sweep",
    "library::string_bytes::gmatch_refused_push_preserves_the_next_match",
    "vm::fault_injection::tests::",
    "vm::registers::tests::",
]
curated = true

# Inline-cache differential. Under `disable-inline-caches` every cache read
# misses; the library's unit-test build alone can turn hits back on per
# thread (`HitMode` in `src/vm/caches.rs`). This dev build runs the whole
# library suite with hits forced off unless a test holds
# `HitMode::required()` (the cache-hit tests do), so every other library test
# also passes on the miss path, plus the corpus differential, which runs each
# example with hits on and off and compares prints, cost and errors. A cache
# test that asserts a hit without the guard fails here. The feature is
# debug-only (compile_error) and appears in no other shape.
[[check]]
name = "inline-cache-differential"
features = ["disable-inline-caches"]
lib_tests = true
curated = true

# Opcode-batching differential. Under `cost-check-interval` the dispatch loop
# reads its flush interval from a thread-local control (the production value
# unless overridden) instead of the constant, so one dev build runs each
# corpus program, boundary case and natural failure at interval 1 and at the
# production interval over a sweep of budgets, and compares prints, cost,
# errors and the accepted charge sites. The feature is debug-only
# (compile_error) and appears in no other shape; this shape runs only the
# differential from the integration crate.
[[check]]
name = "cost-check-interval-differential"
features = ["cost-check-interval"]
tests = ["integration"]
lib_tests = false
only = ["cost::cost_check_interval::corpus_cost_check_interval_differential"]
curated = true

# Observe inventory edges in a dedicated debug build. Instrumented frames do
# not define the shipped native-stack envelope.
[[check]]
name = "native-call-coverage"
features = ["native-call-trace"]
tests = ["native_stack"]
lib_tests = false
only = ["native_call_edge_coverage"]
curated = true

# The native-stack envelope (docs/limits.md "Envelope") is 4 MiB in dev and
# 2 MiB in release, and the sweeps above are dev builds, so the release half
# would otherwise go untested. These run the native-stack probes and linked
# libm symbol check, optimized, in both feature shapes.
[[check]]
name = "release-native-stack"
profile = "release"
tests = ["native_stack", "libm_symbols"]

[[check]]
name = "release-native-stack-snapshot"
profile = "release"
features = ["snapshot"]
tests = ["native_stack", "libm_symbols"]

# The determinism goldens in an optimized build. Release is what ships and
# records replays, and the dev sweeps alone cannot see an optimizer or codegen
# divergence. Every cost test (`cost::`, its source and native-call goldens,
# budget sweeps and accounting pins), the opcode-encoding fixture, the crmath
# golden through its forced FMA backends (`crmath::tests::golden::`, the
# library's test build) and through the shipped math library and `^`
# (`library::crmath_golden::`), the `%` and `math.fmod` edge-case golden
# (`library::replay_goldens::`), and the save golden: saved Rust functions are
# function table ids, not code addresses, so the linker folding identical
# functions (base `unpack` and `table.unpack`) must not change the pinned
# payload. Snapshot features, since the save golden needs them; the
# default-feature release build runs the corpus below.
[[check]]
name = "release-goldens"
profile = "release"
features = ["snapshot"]
tests = ["integration"]
lib_tests = true
only = [
    "cost::",
    "crmath::tests::golden::",
    "instr::tests::persisted_encodings_match_fixture",
    "library::crmath_golden::",
    "library::replay_goldens::remainder",
    "library::replay_goldens::folded_remainder",
    "snapshot::save_golden::",
]

# The example corpus gate, with its corpus cost golden and reference
# comparison, in the default-feature release build: every example's
# `Cost used` from the optimized CLI against `tests/fixtures/corpus_cost.txt`.
# No release shape runs the whole integration crate, so this lane has no
# serial parent (see `standalone_tests_run_in_one_parallel_lane_per_shape`).
[[check]]
name = "release-corpus"
profile = "release"
tests = ["integration"]
only = ["corpus::run_examples::standalone::"]
parallel = {}
feature_unification = "workspace"

[bin]
default = "dellingr"
install = ["dellingr"]
debug = false

[test]
default_package = "dellingr"
# Without a per-sweep profile, this selects the dev profile by default for
# focused tests; explicit profile flags take precedence.
debug = true

# `_G` is the global table itself, not a proxy in front of it; this keeps the
# old wording from returning to code, comments and test names.
[[textlint]]
name = "global-table-not-proxy"
pattern = '\b_G(?: +keeps +its)? +proxy\b'
paths = ["src/**/*.rs", "tests/**/*.rs"]
message = "_G is the global table, not a proxy"

[[textlint]]
name = "no-stale-tracker-ids"
pattern = '\b(?:STD|VM)-\d{3}\b|\bC\d{2}\b:|\(L\d+\)'
paths = ["src/**/*.rs", "tests/**/*.rs"]
message = "comments must carry their own context instead of citing transient tracker IDs"

# A lint suppression is `#[expect(lint, reason = "...")]` on the narrowest item
# or statement, so a suppression that no longer suppresses anything fails the
# warnings-denied clippy run (it cannot tell whether the remaining hit is the
# one the reason describes). Clippy's own `allow_attributes` skips inner
# attributes and cannot see code a cfg removes, so this lexical rule is the
# enforcement; Cargo.toml requires the reason.
[[textlint]]
name = "no-allow-attributes"
pattern = '\ballow\s*\('
paths = ["src/**/*.rs", "tests/**/*.rs", "examples/**/*.rs"]
region = "code"
message = "suppress a lint with #[expect(lint, reason = \"...\")], never allow"

# bench.sh's header documents how to build the external omniLua comparator,
# which is not a dellingr build.
[[textlint]]
name = "no-raw-cargo-in-scripts"
pattern = '\bcargo\s+'
paths = ["scripts/**"]
exclude = ["scripts/bench.sh"]
message = "build and test through brokkr instead of invoking cargo directly"

[[textlint]]
name = "hotpath-alloc-only-at-allocator-install"
pattern = 'feature\s*=\s*"hotpath-alloc"'
paths = ["src/**/*.rs", "tests/**/*.rs", "examples/**/*.rs"]
exclude = ["src/main.rs", "src/bin/dellingr-bench.rs"]
message = "hotpath-alloc implies hotpath; use hotpath for instrumentation guards"

# Tests do not write files: CLI tests feed Lua source on stdin, and anything
# whose subject is a path is a unit test of argument parsing. Test-only policy
# belongs here rather than in crate-wide Clippy bans: host entry points and
# explicit fixture regenerators (examples/regenerate_*, examples/tools/output.rs)
# legitimately write files and sit outside these paths. Write::write_all stays
# available for memory buffers and child stdin pipes. These are lexical guards,
# not alias resolution or a subprocess sandbox.
[[textlint]]
name = "test-code-no-filesystem-writes"
pattern = '\bfs\s*::\s*(?:write|copy|rename|create_dir|create_dir_all|remove_file|remove_dir|remove_dir_all|hard_link|soft_link|symlink|set_permissions)\b|\bFile\s*::\s*(?:create|create_new|options)\b|\bOpenOptions\b|\bcreate_dir(?:_all)?\b|\bCARGO_TARGET_TMPDIR\b|\btempfile\b'
paths = ["src/**/*.rs", "tests/**/*.rs"]
test_code = "only"
must_scan = ["src/compiler/parser/tests.rs", "tests/integration/cli/cli_arguments.rs"]
message = "tests must not write files: feed CLI source on stdin, or unit-test argument parsing"

# Joining use statements catches bare imports of the same primitives, which
# the qualified-call rule above cannot see.
[[textlint]]
name = "test-code-no-filesystem-write-imports"
pattern = '\bfs\s*::[^;]*\b(?:write|copy|rename|create_dir|create_dir_all|remove_file|remove_dir|remove_dir_all|hard_link|soft_link|symlink|set_permissions|File|OpenOptions)\b|\bfs\s*::[^;]*\*'
paths = ["src/**/*.rs", "tests/**/*.rs"]
join_wrapped_use = true
must_scan = ["src/compiler/parser/tests.rs", "tests/integration/cli/cli_arguments.rs"]
message = "tests must not import filesystem write primitives"

[[textlint]]
name = "test-cli-binary-path-use-support"
pattern = 'CARGO_BIN_EXE_'
paths = ["src/**/*.rs", "tests/**/*.rs"]
# The separate release target uses its own sweep's Cargo-built CLI.
exclude = ["tests/integration/support/mod.rs", "tests/libm_symbols.rs"]
region = "string"
test_code = "only"
must_scan = ["src/compiler/parser/tests.rs", "tests/integration/cli/cli_arguments.rs"]
message = "the Cargo-built CLI binary path belongs in tests/integration/support/mod.rs"

# A Lua test script that collapses a check into `cond and 1 or 0` fails with
# `0 != 1` and no hint of which check broke. Write
# `if not cond then error("which check") end` instead.
[[textlint]]
name = "test-lua-no-boolean-collapse"
pattern = 'and 1 or 0'
paths = ["src/**/*.rs", "tests/**/*.rs"]
region = "string"
test_code = "only"
must_scan = ["src/compiler/parser/tests.rs", "tests/integration/library/table_iteration.rs"]
message = "name the failing check: use `if not cond then error(\"which check\") end` instead of `cond and 1 or 0`"

[[textlint]]
name = "test-no-target-paths"
pattern = '(?:^|[/\\"])target[/\\]'
paths = ["src/**/*.rs", "tests/**/*.rs"]
region = "string"
test_code = "only"
must_scan = ["src/compiler/parser/tests.rs", "tests/integration/cli/cli_arguments.rs"]
message = "tests must use Cargo's artifact path instead of target/ paths"

# Ban the executable literal rather than matching Command::new on one line:
# command construction can wrap or use an imported alias.
[[textlint]]
name = "test-no-cargo-processes"
pattern = '"(?:[^"\r\n]*[/\\])?cargo(?:\.exe)?"'
paths = ["src/**/*.rs", "tests/**/*.rs"]
region = "string"
test_code = "only"
must_scan = ["src/compiler/parser/tests.rs", "tests/integration/cli/cli_arguments.rs"]
message = "tests must use the artifacts Cargo already built instead of spawning cargo"

# The gate owns the processes it starts: the Cargo-built CLI and the reference
# Luas, both constructed in tests/integration/support/process.rs, which bounds
# and contains them. Any other `Command` construction under src/ or tests/
# (production code spawns nothing either) is refused, shell tools included,
# with no exceptions. These are lexical guards: a call wrapped across lines or
# built inside a macro is not seen.
[[textlint]]
name = "test-processes-through-support"
pattern = '\bCommand\s*::\s*new\b'
paths = ["src/**/*.rs", "tests/**/*.rs"]
exclude = ["tests/integration/support/process.rs"]
region = "code"
must_scan = ["tests/common/libm_symbols.rs", "src/crmath/tests/golden.rs"]
message = "start processes through tests/integration/support/process.rs"

# The import half of the rule above: an aliased `Command` import would let a
# call through under another name.
[[textlint]]
name = "test-processes-through-support-imports"
pattern = '\bprocess\s*::[^;]*\bCommand\b'
paths = ["src/**/*.rs", "tests/**/*.rs"]
exclude = ["tests/integration/support/process.rs"]
join_wrapped_use = true
must_scan = ["tests/integration/support/mod.rs"]
message = "import std::process::Command only in tests/integration/support/process.rs"

# Every DIFF marker in the example corpus carries a reason. The corpus test
# refuses an empty one too; this reports it before anything compiles. The
# whitespace set matches the test's `str::trim_ascii`.
[[textlint]]
name = "diff-marker-needs-reason"
pattern = '^-- DIFF:[\t\n\x0C\r ]*$'
paths = ["examples/**/*.lua"]
must_scan = ["examples/for_zero_step.lua"]
message = "a -- DIFF: marker needs a reason after the colon"

# No Rust code enumerates the example corpus itself: tests/common/examples.rs
# is its only list, kept equal to the files on disk by the `example-list`
# script check. The first rule refuses the old walker's name and a read_dir
# that mentions the examples tree on its line; the second refuses a string
# literal naming the examples directory itself ("examples", "/examples/"),
# which a walk would need for its root, while file paths such as
# "examples/parse/large_source.lua" stay legal. The list's includers spell
# each source path from one list entry, so they need no directory literal.
# Lexical guards: a root assembled some other way is not seen.
[[textlint]]
name = "example-corpus-only-from-the-list"
pattern = '\bexample_corpus\b|\bread_dir\b.*\bexamples\b'
paths = ["src/**/*.rs", "tests/**/*.rs", "examples/**/*.rs"]
must_scan = ["tests/integration/corpus/run_examples.rs", "src/lib.rs"]
message = "enumerate the example corpus through tests/common/examples.rs, not by walking examples/"

[[textlint]]
name = "no-examples-directory-literal"
pattern = '"/?examples/?"'
paths = ["src/**/*.rs", "tests/**/*.rs", "examples/**/*.rs"]
region = "string"
must_scan = ["tests/integration/support/mod.rs", "tests/integration/corpus/bench_scripts.rs"]
message = "name examples by their list entries in tests/common/examples.rs; no Rust code builds the examples directory path"

# Free callback values are legitimate registration sites. Guard qualified
# method values separately, without banning those registrations. The native
# inventory checker verifies this alternation alongside the call rule below.
[[textlint]]
name = "native-call-method-value"
pattern = '\b(?:State|Self|Frame)\s*::\s*(?:append_function_replacement|append_gsub_replacement|base_ipairs_iter|base_unpack_values|begin_call|begin_callable_call|call|call_anchor|call_anchor_unguarded|call_from_lua|call_unguarded|error_value|eval_batched|format|format_argument|get_table|get_table_unguarded|gsub_empty_pattern|gsub_lua_pattern|gsub_plain_pattern|index_call|insert_through_metamethods|instr_tfor_call|instr_tfor_call_rust_fn|invoke_rust_fn|len_call|main|move_element|newindex_call|push_gmatch_wrapper|reg_get_field|reg_get_table|reg_len|reg_set_field|reg_set_table|remove_through_metamethods|run|run_cli|run_frame|run_invocation|sequence_len|set_index|set_table|set_table_unguarded|sort_through_metamethods|table_sort|table_sort_heap|table_sort_less|table_sort_scratch|table_sort_sift_down|table_sort_values|table_unpack_values|tail_call_from_lua|to_string_with_meta|tostring_bytes|tostring_bytes_unguarded|tostring_rendering|unpack_values)\s*(?:::\s*<[^>]*>\s*)?(?:[,;)\]}]|as\b)'
paths = ["src/**/*.rs"]
exclude = ["src/compiler/**", "src/bin/**"]
region = "code"
test_code = "skip"
message = "keep re-entering methods as direct calls so the native-call inventory sees their edges"

# Native-stack guard (reference/native-calls.md). Every direct call to a
# function that can reach a call back into Lua carries a
# `native_call!("<edge-id>", call)` wrapper naming its edge in
# reference/native-calls.toml. The alternation below is the inventory's
# function names; scripts/native_calls.py checks it against the inventory and
# prints the expected value when they drift. The compiler is excluded: it
# holds no State, and its `Instr::call`/`get_table`/`set_table` constructors
# share names with inventoried functions. `src/bin/` is excluded too: the bench
# harness is a host, calling the public `State` API from outside the VM.
[[textlint]]
name = "native-call-marker"
pattern = '\b(?:append_function_replacement|append_gsub_replacement|base_ipairs_iter|base_unpack_values|begin_call|begin_callable_call|call|call_anchor|call_anchor_unguarded|call_from_lua|call_unguarded|error_value|eval_batched|format|format_argument|get_table|get_table_unguarded|gsub_empty_pattern|gsub_lua_pattern|gsub_plain_pattern|index_call|insert_through_metamethods|instr_tfor_call|instr_tfor_call_rust_fn|invoke_rust_fn|len_call|main|move_element|newindex_call|push_gmatch_wrapper|reg_get_field|reg_get_table|reg_len|reg_set_field|reg_set_table|remove_through_metamethods|run|run_cli|run_frame|run_invocation|sequence_len|set_index|set_table|set_table_unguarded|sort_through_metamethods|table_sort|table_sort_heap|table_sort_less|table_sort_scratch|table_sort_sift_down|table_sort_values|table_unpack_values|tail_call_from_lua|to_string_with_meta|tostring_bytes|tostring_bytes_unguarded|tostring_rendering|unpack_values)\s*(?:::\s*<[^>]*>\s*)?\('
paths = ["src/**/*.rs"]
exclude = ["src/compiler/**", "src/bin/**"]
region = "code"
test_code = "skip"
allow_marker = "native_call!"
# rustfmt puts an overlong wrapper's call two lines below `native_call!(`.
allow_marker_above = 2
except = ['\bfn\s+(?:append_function_replacement|append_gsub_replacement|base_ipairs_iter|base_unpack_values|begin_call|begin_callable_call|call|call_anchor|call_anchor_unguarded|call_from_lua|call_unguarded|error_value|eval_batched|format|format_argument|get_table|get_table_unguarded|gsub_empty_pattern|gsub_lua_pattern|gsub_plain_pattern|index_call|insert_through_metamethods|instr_tfor_call|instr_tfor_call_rust_fn|invoke_rust_fn|len_call|main|move_element|newindex_call|push_gmatch_wrapper|reg_get_field|reg_get_table|reg_len|reg_set_field|reg_set_table|remove_through_metamethods|run|run_cli|run_frame|run_invocation|sequence_len|set_index|set_table|set_table_unguarded|sort_through_metamethods|table_sort|table_sort_heap|table_sort_less|table_sort_scratch|table_sort_sift_down|table_sort_values|table_unpack_values|tail_call_from_lua|to_string_with_meta|tostring_bytes|tostring_bytes_unguarded|tostring_rendering|unpack_values)\b']
must_scan = ["src/vm/eval.rs", "src/lua_std/table.rs"]
message = "a call to a function that can call back into Lua needs a `native_call!(\"<edge-id>\", call)` wrapper, and an edge in reference/native-calls.toml (see reference/native-calls.md)"

[[script_check]]
name = "native-call-inventory"
command = "python3 scripts/native_calls.py"
expect = "ok"
match = "last-line"
stream = "stdout"

[[script_check]]
name = "native-call-checker-tests"
command = "python3 -B scripts/test_native_calls.py"
expect = "ok"
match = "last-line"
stream = "stdout"

[[script_check]]
name = "poison-contract"
command = "python3 -B scripts/poison_contract.py"
expect = "ok"
match = "last-line"
stream = "stdout"

[[script_check]]
name = "poison-contract-checker-tests"
command = "python3 -B scripts/test_poison_contract.py"
expect = "ok"
match = "last-line"
stream = "stdout"

# Interrupt safepoints (src/vm/interrupt.rs): every loop in native library
# code polls or says why it need not (`// bounded:` or `// safepoint:`).
[[script_check]]
name = "safepoint-loops"
command = "python3 -B scripts/safepoint_loops.py"
expect = "ok"
match = "last-line"
stream = "stdout"

[[script_check]]
name = "safepoint-loops-checker-tests"
command = "python3 -B scripts/test_safepoint_loops.py"
expect = "ok"
match = "last-line"
stream = "stdout"

# The integration crate's convention tests police its module tree, so they
# cannot report their own removal; this checks from outside that they still
# compile and run.
[[script_check]]
name = "test-tree-anchor"
command = "python3 -B scripts/test_tree_anchor.py"
expect = "ok"
match = "last-line"
stream = "stdout"

# tests/common/examples.rs is the example corpus's only enumeration (every
# Rust consumer includes it; the corpus gate expands it into one test per
# example). This keeps it equal to the .lua files under examples/, so a new
# example, or a stray untracked one, fails here until it is listed
# (`python3 scripts/example_list.py --write`) or removed. No git: the list is
# compared with what is on disk.
[[script_check]]
name = "example-list"
command = "python3 -B scripts/example_list.py"
expect = "ok"
match = "last-line"
stream = "stdout"
stage = "pre-clippy"

# Its fixture tests write their trees under .scratch/; declared after
# wipe-scratch, at the same stage, so they run after the wipe.
[[script_check]]
name = "example-list-checker-tests"
command = "python3 -B scripts/test_example_list.py"
expect = "ok"
match = "last-line"
stream = "stdout"

[[script_check]]
name = "generated-large-source"
command = "python3 examples/parse/generate.py --check"
expect = "ok"
match = "last-line"
stream = "stdout"
stage = "pre-clippy"

# Inert: brokkr still refuses a dellingr project's config without a
# `[dellingr]` section naming a harness and one workload, a leftover of the
# retired `brokkr dellingr` driver (benchmarks are brokkr.d/bench.toml now,
# and no `hotpath` example exists). Delete this once brokkr drops that check.
[dellingr]
example = "hotpath"
[dellingr.workloads.stub]
file = "bench/sort.lua"
xxh128 = "3186097866519fa8829611bd9b74512b"

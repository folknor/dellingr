# Inventory of the places where Rust calls back into Lua.
#
# reference/native-calls.md explains what this file is for and how to change
# it; `python3 scripts/native_calls.py` checks it against src/ and
# tests/native_stack.rs and prints `ok` when they agree (a `brokkr check`
# script check).
#
# [[function]]  Every function that can reach a call into Lua: the caller
#               closure of `State::call_unguarded` and `State::invoke_rust_fn`.
#               `root` marks one that is also entered from outside the
#               lexical call graph, with the evidence for how:
#                 callback  a library callback, entered through a function
#                           pointer by `invoke_rust_fn`
#                 host-api  a public State method a host (or a host callback)
#                           calls
#                 binary    the CLI's `main`
# [[edge]]      One call site, named by its `native_call!` wrapper:
#               `caller->callee`, plus `:tag` when one caller has several
#               call sites of one callee. An edge is covered by the
#               scenarios whose path runs it, or by the chain kinds or leaf
#               variants it names, or it is excluded with a reason. Never
#               both.
# [segment]     Named runs of edges that scenario paths share; `@name` in a
#               path expands to one.
# [[scenario]]  One kind of native level in tests/native_stack.rs: its path
#               is the ordered edges from one entry into `call_unguarded` to
#               the next.


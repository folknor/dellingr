# ----------------------------------------------------------------- segments

[segment]
# A Lua function entered from Rust: the dispatch loop of a new invocation.
lua = [
    "call_unguarded->run_invocation",
    "run_invocation->run",
    "run->eval_batched",
    "eval_batched->run_frame",
]
# Lua calling a Rust function, which runs to completion inside the loop.
rust = [
    "run_frame->call_from_lua",
    "call_from_lua->begin_call",
    "begin_call->invoke_rust_fn",
]
# An __index function handler reached from a field read; the resolver
# (`State::resolve_index`) has returned before the call, so table, string
# and handler chains all take this path.
get_field = [
    "run_frame->reg_get_field:field",
    "reg_get_field->index_call",
    "index_call->call_unguarded",
]
get_key = [
    "run_frame->reg_get_table",
    "reg_get_table->index_call",
    "index_call->call_unguarded",
]
# A __newindex function handler reached from a field store.
set_field = [
    "run_frame->reg_set_field",
    "reg_set_field->newindex_call",
    "newindex_call->call_unguarded",
]
# A library or host read through __index.
read = [
    "get_table_unguarded->call_unguarded",
]
# A table-library write through __newindex.
write = [
    "set_index->set_table",
    "set_table->call_unguarded",
]
tostring = [
    "tostring_bytes_unguarded->tostring_rendering",
    "tostring_rendering->call_unguarded",
]
# A Rust handler, then the host callback's own State::call.
rust_handler = [
    "call_unguarded->begin_call",
    "begin_call->invoke_rust_fn",
    "call->call_unguarded",
]
sort_comparator = [
    "table_sort_less->call_unguarded",
]


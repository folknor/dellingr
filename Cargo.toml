[package]
name = "dellingr"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "An embeddable, pure-Rust Lua VM with precise instruction-cost accounting"
license = "MIT"
repository = "https://github.com/folknor/dellingr"

# Publish the runtime, its documentation and the standalone host harness.
# Repository tests, Lua workloads and regeneration tools need the checkout's
# gates, fixtures or research tools; they are deliberately not a package test
# surface. Run the integration and library unit suites from the repository.
# Cargo omits example targets whose sources are absent from this allowlist.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/clippy.toml",
    "/src/",
    "/docs/",
    "/reference/",
    "/examples/hotpath.rs",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
snapshot = []
# Debug-only infrastructure for the single-refusal error-boundary sweeps.
fault-injection = []
# Debug-only infrastructure for the inline-cache differential.
disable-inline-caches = []
# Debug-only infrastructure for the opcode-batching differential.
cost-check-interval = []
# Debug-only observation of native-call inventory edges.
native-call-trace = []
# Explicit opt-in for checkout-dependent and long-running math verification.
crmath-sweeps = []

[lints.rust]
future_incompatible = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused = "deny"
variant_size_differences = "deny"

# Package-wide Clippy policy. Library-only, cfg-dependent lint settings stay in
# src/lib.rs.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
match_same_arms = "deny"
redundant_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"

[dependencies]
# Disabling `std` removes indexmap's `RandomState` default in standalone
# builds. A host can re-enable it through Cargo feature unification, so all
# maps still use the explicit fixed hasher in `det_hash::IndexMap`.
indexmap = { version = "2.14", default-features = false }
foldhash = { version = "0.2", default-features = false }
# Only `HashTable` is used (the string interner), with hashes computed by
# `det_hash`. `default-features = false` drops the default hasher; clippy
# bans hashbrown's `HashMap`/`HashSet` in case a host re-enables it.
hashbrown = { version = "0.17", default-features = false }
slotmap = "1.1"
# Profiling is opt-in: cfg_attr keeps measurement macros out of default
# builds, and the optional dependency keeps the profiler out of their graph.
hotpath = { version = "0.29.0", optional = true }

[dev-dependencies]
libc = "0.2.191"
# Correctly rounded arbitrary-precision reference for the src/crmath kernels'
# test oracle (directed-rounding enclosures). Its own `pow` is not used: a
# power-of-two-base shortcut truncates the exponent.
libbeef = "0.1.1"
toml = "1.1.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[example]]
name = "hotpath"
path = "examples/hotpath.rs"
test = true

[[example]]
name = "regenerate_save_golden"
path = "examples/regenerate_save_golden.rs"
required-features = ["snapshot"]

[[example]]
name = "regenerate_crmath_golden"
path = "examples/regenerate_crmath_golden.rs"
test = false

[[example]]
name = "regenerate_error_boundary"
path = "examples/regenerate_error_boundary.rs"
test = false

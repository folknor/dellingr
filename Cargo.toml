[package]
name = "dellingr"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "An embeddable, pure-Rust Lua VM with precise instruction-cost accounting"
license = "MIT"
repository = "https://github.com/folknor/dellingr"

# Dev-only surface: the brokkr results DB alone was ~1.2 MB of the 2.7 MB
# 0.4.0 artifact. `examples/` and `tests/` stay in - the declared
# `[[example]]` target needs the former to build, and both carry the .lua
# corpus that `tests/run_examples.rs` and the diff gate execute.
exclude = [
    ".brokkr/",
    "bench/",
    "notes/",
    "scripts/",
    "brokkr.toml",
    ".review.toml",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath", "hotpath/hotpath-alloc"]
snapshot = []

[lints.rust]
future_incompatible = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused = "deny"
variant_size_differences = "deny"

# Package-wide Clippy policy. Library-only, cfg-dependent lint settings stay in
# src/lib.rs.
[lints.clippy]
disallowed_methods = "deny"
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
match_same_arms = "deny"
redundant_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"

[dependencies]
# Disabling `std` removes indexmap's `RandomState` default in standalone
# builds. A host can re-enable it through Cargo feature unification, so all
# maps still use the explicit fixed hasher in `det_hash::IndexMap`.
indexmap = { version = "2.14", default-features = false }
foldhash = { version = "0.2", default-features = false }
# Only `HashTable` is used (the string interner), with hashes computed by
# `det_hash`. `default-features = false` drops the default hasher; clippy
# bans hashbrown's `HashMap`/`HashSet` in case a host re-enables it.
hashbrown = { version = "0.17", default-features = false }
slotmap = "1.1"
# Deliberately non-optional: many internal functions carry the
# `hotpath::measure` attribute, and without the `hotpath` cargo feature the
# macro expands to nothing, so the dependency costs only compile time. Making
# it optional would need a `cfg_attr` wrapper at every annotation site.
hotpath = "0.28.6"

[dev-dependencies]
libc = "0.2.190"
# Correctly rounded arbitrary-precision reference for the src/crmath kernels'
# test oracle (directed-rounding enclosures). Its own `pow` is not used: a
# power-of-two-base shortcut truncates the exponent.
libbeef = "0.1.1"

[[example]]
name = "hotpath"
path = "examples/hotpath.rs"

[[example]]
name = "regenerate_save_golden"
path = "examples/regenerate_save_golden.rs"
required-features = ["snapshot"]

disallowed-methods = [
    { path = "core::result::Result::ok", reason = "Silently discards errors. Use `?` to propagate, or handle the error explicitly." },
    { path = "core::result::Result::unwrap_or", reason = "Silently discards errors. Handle the error explicitly, or use a scoped allow for an intentional fallback." },
    { path = "core::result::Result::unwrap_or_default", reason = "Silently discards errors. Handle the error explicitly, or use a scoped allow for an intentional fallback." },
    { path = "rand::rng", reason = "Unseeded RNG breaks determinism. Use State.rng, seeded via set_rng_seed.", allow-invalid = true },
    { path = "rand::thread_rng", reason = "Unseeded RNG breaks determinism. Use State.rng, seeded via set_rng_seed.", allow-invalid = true },
    { path = "std::env::args", reason = "Reading process arguments makes behavior depend on host process state." },
    { path = "std::env::args_os", reason = "Reading process arguments makes behavior depend on host process state." },
    { path = "std::env::var", reason = "Reading host environment makes behavior depend on process state." },
    { path = "std::env::var_os", reason = "Reading host environment makes behavior depend on process state." },
    { path = "std::env::vars", reason = "Reading host environment makes behavior depend on process state." },
    { path = "std::env::vars_os", reason = "Reading host environment makes behavior depend on process state." },
    { path = "std::time::Instant::now", reason = "Host timing must not affect deterministic library behavior." },
    { path = "std::time::SystemTime::now", reason = "Host time must not affect deterministic library behavior." },
    { path = "std::io::stdout", reason = "Library output goes through HostCallbacks. Hosts and harnesses whose job is printing use a scoped allow." },
    { path = "std::io::stderr", reason = "Library output goes through HostCallbacks. Hosts and harnesses whose job is printing use a scoped allow." },
]

# Determinism: ban non-deterministic collections
disallowed-types = [
    { path = "std::collections::HashMap", reason = "Non-deterministic iteration order. Use IndexMap or BTreeMap instead." },
    { path = "std::collections::HashSet", reason = "Non-deterministic iteration order. Use BTreeSet instead." },
    { path = "std::collections::hash_map::HashMap", reason = "Non-deterministic iteration order. Use IndexMap or BTreeMap instead." },
    { path = "std::collections::hash_set::HashSet", reason = "Non-deterministic iteration order. Use BTreeSet instead." },
    { path = "std::time::Instant", reason = "Host timing must not affect deterministic library behavior." },
    { path = "std::time::SystemTime", reason = "Host time must not affect deterministic library behavior." },
    { path = "std::hash::RandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::IndexMap or BTreeMap instead." },
    { path = "std::collections::hash_map::RandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::IndexMap or BTreeMap instead." },
    { path = "foldhash::fast::RandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "foldhash::fast::SeedableRandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "foldhash::quality::RandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "foldhash::quality::SeedableRandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "std::hash::DefaultHasher", reason = "The standard hasher is not a stable replay contract. Use a specified deterministic hasher." },
]

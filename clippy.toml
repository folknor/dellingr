# Determinism: ban non-deterministic collections. Re-export aliases share a
# definition, so configure each type once; the fixture proves that definition.
# Keep allow-invalid until a fixture run proves resolution on the gate toolchain.
disallowed-types = [
    { path = "std::collections::hash_map::HashMap", reason = "Non-deterministic iteration order. Use IndexMap or BTreeMap instead." },
    { path = "std::collections::hash_set::HashSet", reason = "Non-deterministic iteration order. Use BTreeSet instead." },
    { path = "hashbrown::HashMap", reason = "Use det_hash::IndexMap or BTreeMap. Only hashbrown::HashTable with det_hash hashes is allowed." },
    { path = "hashbrown::HashSet", reason = "Use det_hash::IndexSet or BTreeSet. Only hashbrown::HashTable with det_hash hashes is allowed." },
    { path = "std::time::Instant", reason = "Host timing must not affect deterministic library behavior." },
    { path = "std::time::SystemTime", reason = "Host time must not affect deterministic library behavior." },
    { path = "std::collections::hash_map::RandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::IndexMap or BTreeMap instead." },
    { path = "foldhash::fast::RandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "foldhash::fast::SeedableRandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "foldhash::quality::RandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "foldhash::quality::SeedableRandomState", reason = "Randomized hash seeding breaks determinism. Use det_hash::FixedState.", allow-invalid = true },
    { path = "std::hash::DefaultHasher", reason = "The standard hasher is not a stable replay contract. Use a specified deterministic hasher." },
]

# Result callbacks can explicitly handle an error (panic, resume_unwind,
# PoisonError::into_inner); banning unwrap_or_else/map_or/map_or_else by name
# would reject those handlers too. Review the callback's handling instead.
# Additional host bans need scoped allows at their legitimate host sites first:
# current_dir in regenerate_save_golden, process::id in the scratch helper,
# available_parallelism in test support and math sweeps, and pointer addr in
# the native-stack probe. Keep those changes with their owners.
